<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>deputy: cheap checks run on timers; the PR check finds a review request; legwork, review and challenge run on outside models; the posting checks pass and the review is posted; a pop-up says so; then the core crashes and the guard brings it back</title>
  <!-- One 25-second loop:
       0-2.5s checks; 2.5-5s request; 5-8s legwork; 8-11s review; 11-14s challenge; 14-16.5s posting checks;
       16.5-21s posted, pop-up at 18.3s; 21-25s the core crashes and the guard brings it back. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1C1917"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="400" rx="18" fill="url(#bg)"/>
  <rect x="24" y="20" width="712" height="320" rx="12" fill="#111827" stroke="#334155"/>

  <!-- title row -->
  <rect x="40" y="32" width="24" height="24" rx="6" fill="#FBBF24"/>
  <text x="52" y="49" fill="#0F172A" font-size="14" font-weight="bold" text-anchor="middle">d</text>
  <text x="74" y="49" fill="#F1F5F9" font-size="15" font-weight="600">deputy</text>
  <text x="720" y="49" fill="#94A3B8" font-size="12" text-anchor="end" font-family="Consolas, Menlo, monospace">guard ✓ · core ✓ · one run at a time</text>

  <!-- the jobs: cheap checks on timers -->
  <g font-size="12">
    <rect x="40" y="66" width="216" height="30" rx="15" fill="#1E293B" stroke="#334155"/>
    <circle cx="58" cy="81" r="5" fill="#64748B">
      <animate attributeName="fill" dur="25s" repeatCount="indefinite" calcMode="discrete" values="#64748B;#FBBF24;#22C55E;#EF4444;#22C55E" keyTimes="0;0.08;0.66;0.84;0.95"/>
    </circle>
    <text x="70" y="85" fill="#E2E8F0" font-weight="600">pr-review</text>
    <text x="244" y="85" fill="#94A3B8" text-anchor="end">every 5 min
      <animate attributeName="fill" dur="25s" repeatCount="indefinite" calcMode="discrete" values="#94A3B8;#FBBF24;#94A3B8" keyTimes="0;0.08;0.66"/>
    </text>

    <rect x="268" y="66" width="216" height="30" rx="15" fill="#1E293B" stroke="#334155"/>
    <circle cx="286" cy="81" r="5" fill="#64748B"/>
    <text x="298" y="85" fill="#E2E8F0" font-weight="600">failing-ci</text>
    <text x="472" y="85" fill="#94A3B8" text-anchor="end">every 15 min</text>

    <rect x="496" y="66" width="224" height="30" rx="15" fill="#1E293B" stroke="#334155"/>
    <circle cx="514" cy="81" r="5" fill="#64748B"/>
    <text x="526" y="85" fill="#E2E8F0" font-weight="600">assigned-issues</text>
    <text x="708" y="85" fill="#94A3B8" text-anchor="end">every 30 min</text>
  </g>

  <!-- the run's steps -->
  <g font-size="12.5" text-anchor="middle">
    <g>
      <rect x="40" y="110" width="106" height="28" rx="8" fill="#1E293B"/>
      <rect x="40" y="110" width="106" height="28" rx="8" fill="#FBBF24" opacity="0">
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1;0.2"/>
      </rect>
      <text x="93" y="129" fill="#CBD5E1">Request
        <animate attributeName="fill" dur="25s" repeatCount="indefinite" calcMode="discrete" values="#CBD5E1;#0F172A;#86EFAC" keyTimes="0;0.1;0.2"/>
      </text>
    </g>
    <g>
      <rect x="154" y="110" width="106" height="28" rx="8" fill="#1E293B"/>
      <rect x="154" y="110" width="106" height="28" rx="8" fill="#FBBF24" opacity="0">
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2;0.32"/>
      </rect>
      <text x="207" y="129" fill="#CBD5E1">Legwork
        <animate attributeName="fill" dur="25s" repeatCount="indefinite" calcMode="discrete" values="#CBD5E1;#0F172A;#86EFAC" keyTimes="0;0.2;0.32"/>
      </text>
    </g>
    <g>
      <rect x="268" y="110" width="106" height="28" rx="8" fill="#1E293B"/>
      <rect x="268" y="110" width="106" height="28" rx="8" fill="#FBBF24" opacity="0">
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.32;0.44"/>
      </rect>
      <text x="321" y="129" fill="#CBD5E1">Review
        <animate attributeName="fill" dur="25s" repeatCount="indefinite" calcMode="discrete" values="#CBD5E1;#0F172A;#86EFAC" keyTimes="0;0.32;0.44"/>
      </text>
    </g>
    <g>
      <rect x="382" y="110" width="106" height="28" rx="8" fill="#1E293B"/>
      <rect x="382" y="110" width="106" height="28" rx="8" fill="#FBBF24" opacity="0">
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.44;0.56"/>
      </rect>
      <text x="435" y="129" fill="#CBD5E1">Challenge
        <animate attributeName="fill" dur="25s" repeatCount="indefinite" calcMode="discrete" values="#CBD5E1;#0F172A;#86EFAC" keyTimes="0;0.44;0.56"/>
      </text>
    </g>
    <g>
      <rect x="496" y="110" width="106" height="28" rx="8" fill="#1E293B"/>
      <rect x="496" y="110" width="106" height="28" rx="8" fill="#FBBF24" opacity="0">
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.56;0.66"/>
      </rect>
      <text x="549" y="129" fill="#CBD5E1">Checks
        <animate attributeName="fill" dur="25s" repeatCount="indefinite" calcMode="discrete" values="#CBD5E1;#0F172A;#86EFAC" keyTimes="0;0.56;0.66"/>
      </text>
    </g>
    <g>
      <rect x="610" y="110" width="110" height="28" rx="8" fill="#1E293B"/>
      <rect x="610" y="110" width="110" height="28" rx="8" fill="#22C55E" opacity="0">
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.66;0.84"/>
      </rect>
      <text x="665" y="129" fill="#CBD5E1">Posted
        <animate attributeName="fill" dur="25s" repeatCount="indefinite" calcMode="discrete" values="#CBD5E1;#052E16;#86EFAC" keyTimes="0;0.66;0.84"/>
      </text>
    </g>
  </g>
  <line x1="40" y1="152" x2="720" y2="152" stroke="#334155"/>

  <!-- 0. the checks -->
  <g opacity="1" font-size="14">
    <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1"/>
    <text x="40" y="184" fill="#F1F5F9" font-size="17" font-weight="600">Checks run on timers. They cost nothing.</text>
    <g font-family="Consolas, Menlo, monospace" font-size="13">
      <text x="40" y="216" fill="#94A3B8">failing-ci       0 found  · no model run</text>
      <text x="40" y="240" fill="#94A3B8">assigned-issues  0 found  · no model run</text>
      <text x="40" y="264" fill="#FBBF24" opacity="0">pr-review        1 found  · starting one agent run
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.06"/>
      </text>
    </g>
    <text x="40" y="304" fill="#94A3B8" font-size="13">A check is any command that prints JSON items. Yours can watch CI, issues, a queue, anything.</text>
  </g>

  <!-- 1. the request -->
  <g opacity="0">
    <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1;0.2"/>
    <rect x="40" y="170" width="680" height="84" rx="10" fill="#0F172A" stroke="#334155"/>
    <circle cx="74" cy="212" r="18" fill="#7C3AED"/>
    <text x="74" y="218" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">M</text>
    <text x="104" y="204" fill="#F1F5F9" font-size="15"><tspan font-weight="600">maya</tspan> requested your review</text>
    <text x="104" y="228" fill="#94A3B8" font-size="13" font-family="Consolas, Menlo, monospace">acme/shop #42 · Let coupons stack at checkout · +6 −1</text>
    <text x="40" y="290" fill="#94A3B8" font-size="13">Drafts, your own PRs, and heads already handled are skipped.</text>
  </g>

  <!-- 2. legwork -->
  <g opacity="0" font-size="14">
    <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2;0.32"/>
    <text x="40" y="182" fill="#F1F5F9" font-size="16" font-weight="600">Legwork</text>
    <text x="720" y="182" fill="#94A3B8" font-size="12" text-anchor="end">any tool, cheapest first · collects facts, no opinions</text>
    <rect x="40" y="196" width="680" height="8" rx="4" fill="#1E293B"/>
    <rect x="40" y="196" width="0" height="8" rx="4" fill="#FBBF24">
      <animate attributeName="width" dur="25s" repeatCount="indefinite" values="0;0;680;680" keyTimes="0;0.21;0.31;1"/>
    </rect>
    <g fill="#CBD5E1">
      <text x="40" y="236" opacity="0">• cartTotal() has 2 callers: checkout.js:41, invoice.js:12
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.23"/>
      </text>
      <text x="40" y="262" opacity="0">• CI is green at the head; no open review threads
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.26"/>
      </text>
      <text x="40" y="288" opacity="0">• no other open PR touches src/cart
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.29"/>
      </text>
    </g>
  </g>

  <!-- 3. review -->
  <g opacity="0">
    <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.32;0.44"/>
    <text x="40" y="182" fill="#F1F5F9" font-size="16" font-weight="600">Review</text>
    <text x="720" y="182" fill="#94A3B8" font-size="12" text-anchor="end">a judge you trust drafts it</text>
    <rect x="40" y="194" width="400" height="104" rx="8" fill="#0B1220" stroke="#334155"/>
    <g font-family="Consolas, Menlo, monospace" font-size="12">
      <text x="54" y="216" fill="#86EFAC">+  for (const c of coupons) {</text>
      <text x="54" y="236" fill="#86EFAC">+    discount += c.amount;</text>
      <text x="54" y="256" fill="#86EFAC">+  }</text>
      <rect x="44" y="264" width="392" height="22" fill="#7F1D1D" opacity="0.55"/>
      <text x="54" y="280" fill="#FCA5A5">   return subtotal - discount;</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.38"/>
      <rect x="456" y="194" width="264" height="104" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="470" y="218" fill="#F1F5F9" font-size="13">Two coupons worth more than</text>
      <text x="470" y="238" fill="#F1F5F9" font-size="13">the cart make this negative.</text>
      <rect x="470" y="258" width="140" height="24" rx="6" fill="#422006"/>
      <text x="540" y="275" fill="#FBBF24" font-size="12" font-weight="bold" text-anchor="middle">APPROVE + CAUTION</text>
    </g>
  </g>

  <!-- 4. challenge -->
  <g opacity="0" font-size="14">
    <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.44;0.56"/>
    <text x="40" y="182" fill="#F1F5F9" font-size="16" font-weight="600">Challenge</text>
    <text x="720" y="182" fill="#94A3B8" font-size="12" text-anchor="end">money is involved, so a second judge tries to prove the draft wrong</text>
    <rect x="40" y="196" width="680" height="34" rx="8" fill="#0B1220" stroke="#334155"/>
    <text x="54" y="218" fill="#CBD5E1">Claim: the cart total can go below zero (total.js:17)</text>
    <text x="40" y="262" fill="#94A3B8" opacity="1">trying to disprove it…
      <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.5"/>
    </text>
    <text x="40" y="262" fill="#86EFAC" opacity="0">✓ Could not disprove it: coupons of 30 and 30 on a 50 cart give −10.
      <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.5"/>
    </text>
    <text x="40" y="292" fill="#94A3B8" opacity="0" font-size="13">Out of limit? The next tool takes it. No judge left? The run judges by itself.
      <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.52"/>
    </text>
  </g>

  <!-- 5. posting checks -->
  <g opacity="0" font-size="13.5">
    <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.56;0.66"/>
    <text x="40" y="182" fill="#F1F5F9" font-size="16" font-weight="600">Posting checks</text>
    <text x="720" y="182" fill="#94A3B8" font-size="12" text-anchor="end">in code, not in a prompt</text>
    <g fill="#CBD5E1">
      <text x="40" y="212">✓ the head hasn't moved since the review</text>
      <text x="40" y="236" opacity="0">✓ the inline comment sits inside GitHub's diff
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.575"/>
      </text>
      <text x="40" y="260" opacity="0">✓ important work, and the challenge is on file
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.59"/>
      </text>
      <text x="40" y="284" opacity="0">✓ short paragraphs, no dashes, @maya tagged by login
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.605"/>
      </text>
      <text x="40" y="308" opacity="0">✓ verdict rules: approve, with a red "Do not merge until"
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.62"/>
      </text>
    </g>
  </g>

  <!-- 6. posted, then the pop-up -->
  <g opacity="0">
    <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.66;0.84"/>
    <rect x="40" y="168" width="680" height="152" rx="10" fill="#0D1117" stroke="#30363D"/>
    <circle cx="62" cy="192" r="10" fill="#238636"/>
    <path d="M57 192 l4 4 l7 -8" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="80" y="197" fill="#E6EDF3" font-size="14"><tspan font-weight="600">you</tspan> approved these changes</text>
    <rect x="56" y="214" width="3" height="54" fill="#DA3633"/>
    <text x="70" y="232" fill="#FF7B72" font-size="13" font-weight="600">⊘ Caution</text>
    <text x="70" y="256" fill="#E6EDF3" font-size="13" font-weight="600">Do not merge until the total can't go below zero.</text>
    <text x="56" y="296" fill="#8B949E" font-size="13">@maya, stacking coupons in one loop reads well.</text>

    <g opacity="0">
      <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.73"/>
      <animateTransform attributeName="transform" type="translate" dur="25s" repeatCount="indefinite" values="0 -12;0 -12;0 0;0 0" keyTimes="0;0.73;0.755;1"/>
      <rect x="452" y="200" width="282" height="104" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="452" y="200" width="282" height="26" rx="6" fill="#E2E8F0"/>
      <text x="464" y="218" fill="#0F172A" font-size="12" font-weight="600">Reviewed: shop #42 (coupons stack)</text>
      <text x="722" y="218" fill="#475569" font-size="12" text-anchor="end">✕</text>
      <circle cx="476" cy="250" r="9" fill="#2563EB"/>
      <text x="476" y="254" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">i</text>
      <text x="494" y="248" fill="#0F172A" font-size="12">approved, do not merge until</text>
      <text x="494" y="264" fill="#0F172A" font-size="12">the total can't go below zero.</text>
      <text x="494" y="290" fill="#64748B" font-size="11">♪ chime</text>
      <rect x="664" y="274" width="58" height="22" rx="4" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="693" y="289" fill="#0F172A" font-size="12" text-anchor="middle">OK</text>
    </g>
  </g>

  <!-- 7. a crash, healed by the guard -->
  <g opacity="0">
    <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.84"/>
    <text x="40" y="182" fill="#F1F5F9" font-size="16" font-weight="600">A crash heals itself</text>
    <text x="720" y="182" fill="#94A3B8" font-size="12" text-anchor="end">the guard restarts the core: 30 s, then longer, at most 5 min</text>
    <rect x="40" y="194" width="680" height="84" rx="8" fill="#0B1220" stroke="#334155"/>
    <g font-family="Consolas, Menlo, monospace" font-size="12.5">
      <text x="54" y="216" fill="#FCA5A5">14:41:07  core stopped (exit 1)</text>
      <text x="54" y="240" fill="#FBBF24" opacity="0">14:41:37  guard: starting the core again
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.89"/>
      </text>
      <text x="54" y="264" fill="#86EFAC" opacity="0">14:41:38  core started · checks resume, no run lost
        <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.95"/>
      </text>
    </g>
    <!-- the status line above the Claude Code prompt -->
    <rect x="40" y="290" width="680" height="30" rx="6" fill="#0F172A" stroke="#334155"/>
    <circle cx="58" cy="305" r="5" fill="#EF4444">
      <animate attributeName="fill" dur="25s" repeatCount="indefinite" calcMode="discrete" values="#EF4444;#FBBF24;#22C55E" keyTimes="0;0.87;0.95"/>
    </circle>
    <text x="72" y="310" fill="#FCA5A5" font-size="12.5" font-family="Consolas, Menlo, monospace" opacity="1">deputy: STOPPED (last check 1m ago)
      <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.87"/>
    </text>
    <text x="72" y="310" fill="#FBBF24" font-size="12.5" font-family="Consolas, Menlo, monospace" opacity="0">deputy: restarting (the guard brings it back)
      <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.87;0.95"/>
    </text>
    <text x="72" y="310" fill="#CBD5E1" font-size="12.5" font-family="Consolas, Menlo, monospace" opacity="0">deputy: idle, checked just now · last: <tspan fill="#60A5FA" text-decoration="underline">shop #42</tspan> (coupons stack) at 14:40
      <animate attributeName="opacity" dur="25s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.95"/>
    </text>
  </g>

  <!-- the promise -->
  <circle cx="36" cy="370" r="5" fill="#22C55E"/>
  <text x="50" y="375" fill="#CBD5E1" font-size="14">No model runs while nothing waits. Crashes heal themselves. New installs only draft.</text>
</svg>
